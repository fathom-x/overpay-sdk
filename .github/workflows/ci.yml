name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Includes the check that src/generated.rs matches the spec.
      - run: cargo test --workspace --locked
      - name: Package (nothing is published)
        run: cargo package --workspace --locked

  rust-msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      # Keep in step with rust-version in rust/Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo check --workspace --all-targets --locked

  ruby:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v5
      # NIP-98 signing binds libsecp256k1 over ffi. OVERPAY_REQUIRE_SECP256K1
      # turns a missing library into a failure instead of a skip.
      - name: Install libsecp256k1
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsecp256k1-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      - name: Generated code is current
        run: bin/codegen --check
      - name: Tests
        env:
          OVERPAY_REQUIRE_SECP256K1: "1"
        run: bundle exec rake test
      - name: Build gem
        run: gem build overpay.gemspec

  # Both SDKs carry the same copy of the contract.
  spec-copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: diff -r ruby/spec rust/crates/overpay-sdk/spec
